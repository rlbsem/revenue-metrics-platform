name: Refresh synthetic USD evidence
on:
  push:
    branches:
      - fix/usd-metrics-enterprise-bridge-20261022
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RMP_DUCKDB_THREADS: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked dependencies and project
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Regenerate USD data, dbt models, metrics, and evidence
        run: python scripts/verify.py
      - name: Rebuild original account bridge image from new local USD evidence
        run: python scripts/render_account_bridge.py
      - name: Withdraw original native publication from current USD project
        run: |
          rm -f docs/evidence/snowflake/fixture/analyst-export.csv
          rm -f docs/evidence/snowflake/fixture/published/*.json
          rmdir docs/evidence/snowflake/fixture/published || true
      - name: Recalculate package inventory and verify contents
        run: python scripts/package.py
      - name: Publish regenerated evidence to correction branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A README.md docs/evidence docs/images/account-discrepancy-bridge.jpg
          if ! git diff --cached --quiet; then
            git commit -m "evidence: regenerate synthetic USD releases and account bridge [skip ci]"
            git push origin HEAD:fix/usd-metrics-enterprise-bridge-20261022
          fi
