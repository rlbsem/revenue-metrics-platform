name: Verify configured Snowflake account
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Bounded synthetic dataset to verify (start with fixture)"
        type: choice
        required: true
        default: fixture
        options:
          - fixture
          - enterprise
      enterprise_approved:
        description: "Owner has reviewed fixture evidence, credits and enterprise cost"
        type: boolean
        required: true
        default: false
# The verifier uses a dedicated database with shared RAW source tables.
# Never overlap protected cloud-verification workflows.
concurrency:
  group: revenue-metrics-snowflake-demo
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.profile == 'fixture' && 30 || 120 }}
    environment: snowflake-demo
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_CONSUMER_USER: ${{ secrets.SNOWFLAKE_CONSUMER_USER }}
      SNOWFLAKE_CONSUMER_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_CONSUMER_PRIVATE_KEY_PASSPHRASE }}
      RMP_ENTERPRISE_APPROVED: ${{ inputs.profile == 'enterprise' && inputs.enterprise_approved && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Materialize secret key outside repository
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PEM }}
          CONSUMER_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_CONSUMER_PRIVATE_KEY_PEM }}
        run: |
          umask 077
          test -n "$PRIVATE_KEY"
          test -n "$CONSUMER_PRIVATE_KEY"
          printf '%s' "$PRIVATE_KEY" > "$RUNNER_TEMP/snowflake.p8"
          printf '%s' "$CONSUMER_PRIVATE_KEY" > "$RUNNER_TEMP/snowflake-consumer.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/snowflake.p8" >> "$GITHUB_ENV"
          echo "SNOWFLAKE_CONSUMER_PRIVATE_KEY_PATH=$RUNNER_TEMP/snowflake-consumer.p8" >> "$GITHUB_ENV"
      - name: Verify isolated baseline, correction and exact full equivalence
        env:
          VERIFIED_PROFILE: ${{ inputs.profile }}
        run: python scripts/verify_snowflake.py --require-cloud --profile "$VERIFIED_PROFILE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sanitized-cloud-verification
          path: |
            .local/snowflake/verification.json
            .local/snowflake/*-results.json
            .local/snowflake/query-history.json
      - name: Remove temporary key
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/snowflake.p8" "$RUNNER_TEMP/snowflake-consumer.p8"
