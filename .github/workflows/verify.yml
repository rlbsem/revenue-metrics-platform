name: Verify commercial analytics
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            venv_python: .venv/bin/python
          - os: windows-latest
            venv_python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m venv .venv
      - name: Install locked dependencies
        shell: bash
        run: ${{ matrix.venv_python }} -m pip install -r requirements.lock
      - name: Install project
        shell: bash
        run: ${{ matrix.venv_python }} -m pip install --no-deps --no-build-isolation -e .
      - name: Verify
        shell: bash
        run: ${{ matrix.venv_python }} scripts/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-evidence-${{ matrix.os }}
          path: docs/evidence/
