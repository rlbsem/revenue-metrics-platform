name: Verify commercial analytics
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            venv_python: .venv/bin/python
            duckdb_threads: 1
          - os: windows-latest
            venv_python: .venv/Scripts/python.exe
            duckdb_threads: 1
    runs-on: ${{ matrix.os }}
    env:
      # Bound local engine parallelism after Windows/Linux native subprocess crashes.
      # The fixture, model SQL, enterprise scale and equivalence checks are unchanged.
      RMP_DUCKDB_THREADS: ${{ matrix.duckdb_threads }}
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m venv .venv
      - name: Install locked dependencies
        shell: bash
        run: ${{ matrix.venv_python }} -m pip install -r requirements.lock
      - name: Install project
        shell: bash
        run: ${{ matrix.venv_python }} -m pip install --no-deps --no-build-isolation -e .
      - name: Verify
        shell: bash
        run: ${{ matrix.venv_python }} scripts/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-evidence-${{ matrix.os }}
          path: docs/evidence/
      - name: Retain local enterprise failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-dbt-diagnostics-${{ matrix.os }}
          # This workflow runs only DuckDB with synthetic data, never cloud credentials.
          # Do not add this diagnostic path to the separate Snowflake workflow.
          path: .local/enterprise-verification/**/dbt-build.log
