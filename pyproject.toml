[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "revenue-metrics-platform"
version = "1.0.0"
description = "Commercial dimensional models and shared metric consumption"
requires-python = ">=3.12,<3.13"
dependencies = ["dbt-core==1.9.8", "dbt-duckdb==1.9.6", "dbt-snowflake==1.9.4", "duckdb==1.3.2", "streamlit==1.49.1"]

[project.scripts]
revenue = "revenue_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
